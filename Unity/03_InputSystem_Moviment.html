<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unity 2D · Sessió 3 — InputSystem. Moviment del Player</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* STREAMING_CHUNK:Definint la paleta i les variables base... */
:root{
  --bg:#0a0a1a;
  --panel:#12122b;
  --panel-2:#1b1b3a;
  --line:rgba(255,255,255,0.09);
  --text:#F1F5FF;
  --text-dim:#B8C0D9;
  --text-faint:#7580A0;
  --cyan:#00f3ff;
  --cyan-dim:rgba(0,243,255,0.14);
  --violet:#b535ff;
  --violet-dim:rgba(181,53,255,0.14);
  --green:#00ff88;
  --red:#f43f5e;
  --amber:#f59e0b;
  --radius:10px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Inter',sans-serif;
  min-height:100vh;
  background-image:
    radial-gradient(circle at 12% 8%, rgba(0,243,255,0.09) 0%, transparent 42%),
    radial-gradient(circle at 88% 92%, rgba(181,53,255,0.09) 0%, transparent 42%);
  background-attachment:fixed;
}
h1,h2,h3,.display{font-family:'Space Grotesk',sans-serif;}
code,.mono,pre{font-family:'JetBrains Mono',monospace;}
a{color:var(--cyan);}

/* STREAMING_CHUNK:Maquetant la capçalera i l'indicador de progrés... */
.topbar{
  position:sticky; top:0; z-index:20;
  background:linear-gradient(180deg,#0d0d22 0%,#0a0a1a 100%);
  border-bottom:1px solid var(--line);
  padding:14px 24px 12px;
  backdrop-filter:blur(8px);
}
.session-title-row{display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:10px;}
.session-title{font-size:20px; font-weight:600; letter-spacing:0.2px;}
.session-title span{color:var(--text-faint); font-weight:400; font-size:13px; margin-left:8px;}
.teacher-btn{
  background:var(--panel-2); color:var(--text-dim); border:1px solid var(--line);
  padding:8px 14px; border-radius:8px; font-size:13px; cursor:pointer;
  display:flex; align-items:center; gap:6px; transition:all .15s; flex-shrink:0;
  font-family:'Inter',sans-serif;
}
.teacher-btn:hover{border-color:var(--violet); color:var(--violet);}

.nav-row{display:flex; align-items:center; gap:16px;}
.nav-btn{
  background:var(--panel-2); border:1px solid var(--line); color:var(--text);
  width:36px; height:36px; border-radius:8px; cursor:pointer; font-size:18px;
  display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:all .15s;
}
.nav-btn:hover:not(:disabled){border-color:var(--cyan); color:var(--cyan);}
.nav-btn:disabled{opacity:.3; cursor:default;}
.nav-mid{flex:1; min-width:0;}
.nav-label{font-size:12px; color:var(--text-faint); margin-bottom:6px; display:flex; justify-content:space-between; gap:12px;}
.nav-label b{color:var(--text-dim); font-weight:600; white-space:nowrap;}
.nav-label span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}

.gauge{height:10px; border-radius:6px; background:var(--panel-2); position:relative; overflow:hidden; border:1px solid var(--line);}
.gauge-fill{
  height:100%; border-radius:6px;
  background:linear-gradient(90deg,#00b4d8,var(--cyan) 55%,var(--violet));
  box-shadow:0 0 12px rgba(0,243,255,.5);
  transition:width .35s ease; position:relative;
}
.gauge-ticks{position:absolute; inset:0; display:flex;}
.gauge-ticks div{flex:1; border-right:1px solid rgba(10,10,26,.6);}
.gauge-ticks div:last-child{border-right:none;}

/* STREAMING_CHUNK:Definint el layout de barra lateral i contingut ample... */
.layout{display:flex; max-width:1340px; margin:0 auto;}
.sidebar{width:280px; flex-shrink:0; padding:20px 12px; border-right:1px solid var(--line); min-height:calc(100vh - 96px);}
.sidebar-label{font-size:11px; text-transform:uppercase; letter-spacing:1px; color:var(--text-faint); padding:0 12px; margin:18px 0 8px;}
.sidebar-label:first-child{margin-top:0;}
.mod-item{
  display:flex; align-items:flex-start; gap:10px; padding:10px 12px; border-radius:8px;
  cursor:pointer; margin-bottom:2px; color:var(--text-dim); font-size:13.5px; line-height:1.35; transition:all .12s;
}
.mod-item:hover{background:var(--panel);}
.mod-item.active{background:var(--cyan-dim); color:var(--text); box-shadow:inset 3px 0 0 var(--cyan);}
.mod-item .tag{font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--text-faint); background:var(--panel-2); padding:2px 6px; border-radius:4px; flex-shrink:0;}
.mod-item.active .tag{color:var(--cyan); background:rgba(0,243,255,.12);}
.mod-item.special{border-top:1px solid var(--line); margin-top:10px; padding-top:14px; border-radius:0;}
.mod-item.special .tag{color:var(--violet); background:var(--violet-dim);}
.mod-item.special.quiz .tag{color:var(--green); background:rgba(0,255,136,.12);}

.content{flex:1; padding:30px 44px; min-width:0;}
.eyebrow{font-size:11px; text-transform:uppercase; letter-spacing:1.2px; color:var(--text-faint); margin-bottom:6px;}
.content h2{font-size:26px; margin:0 0 18px;}
.content h3{font-size:16px; margin:24px 0 10px; color:var(--text);}
.content p{line-height:1.68; color:var(--text-dim); margin:0 0 14px;}
.content ul,.content ol{line-height:1.68; color:var(--text-dim); padding-left:22px; margin:0 0 14px;}
.content li{margin-bottom:6px;}
.content strong{color:var(--text);}
pre{
  background:#05050f; border:1px solid rgba(0,243,255,.16); border-radius:var(--radius);
  padding:14px 16px; overflow-x:auto; font-size:12.5px; line-height:1.6; color:var(--green); margin:0 0 14px;
}
pre .cm{color:var(--text-faint);}
pre .bad{color:var(--red);}
.mono{font-size:.94em;}
p .mono,li .mono,td .mono{background:var(--panel-2); padding:1px 5px; border-radius:4px; color:var(--cyan);}

.panel-box{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px; margin:0 0 14px;}
.panel-box.warn{border-left:3px solid var(--red);}
.panel-box.tip{border-left:3px solid var(--cyan);}
.panel-box.deepen{border-left:3px solid var(--violet);}
.panel-box p{margin:0;}

table.data{width:100%; border-collapse:collapse; font-size:13px; margin:0 0 14px;}
table.data th{text-align:left; padding:8px 10px; background:var(--panel-2); color:var(--text-faint); font-size:11px; text-transform:uppercase; letter-spacing:.6px; font-weight:600;}
table.data td{padding:8px 10px; border-top:1px solid var(--line); color:var(--text-dim); vertical-align:top;}

.bottom-nav{display:flex; justify-content:space-between; gap:12px; margin-top:28px; padding-top:18px; border-top:1px solid var(--line);}
.btn{
  background:var(--panel-2); border:1px solid var(--line); color:var(--text); font-family:'Inter',sans-serif;
  padding:9px 16px; border-radius:8px; font-size:13px; cursor:pointer; transition:all .15s;
}
.btn:hover:not(:disabled){border-color:var(--cyan); color:var(--cyan);}
.btn:disabled{opacity:.3; cursor:default;}
.btn.primary{background:linear-gradient(135deg,rgba(0,243,255,.2),rgba(181,53,255,.25)); border-color:var(--cyan); color:var(--cyan);}
.btn.primary:hover:not(:disabled){box-shadow:0 0 14px rgba(0,243,255,.35);}
.btn.danger{border-color:var(--red); color:var(--red);}
.btn.small{padding:6px 11px; font-size:12px;}

/* STREAMING_CHUNK:Donant estil a la checklist del repte pràctic... */
.check-item{display:flex; align-items:flex-start; gap:11px; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px 13px; margin-bottom:7px; cursor:pointer; transition:all .12s;}
.check-item:hover{border-color:rgba(0,243,255,.3);}
.check-item input{margin-top:3px; accent-color:var(--cyan); flex-shrink:0;}
.check-item span{font-size:13.5px; color:var(--text-dim); line-height:1.5;}
.check-item.done span{color:var(--text-faint); text-decoration:line-through;}
.progress-row{display:flex; align-items:center; gap:14px; margin-bottom:18px;}
.progress-bar{flex:1; height:8px; background:var(--panel-2); border:1px solid var(--line); border-radius:6px; overflow:hidden;}
.progress-bar div{height:100%; width:0; background:linear-gradient(90deg,var(--cyan),var(--violet)); transition:width .3s ease;}
.progress-pct{font-family:'JetBrains Mono',monospace; font-size:13px; color:var(--cyan); min-width:44px; text-align:right;}

/* STREAMING_CHUNK:Preparant les finestres modals i el flux del test... */
.overlay{position:fixed; inset:0; background:rgba(5,5,15,.82); backdrop-filter:blur(6px); z-index:50; display:flex; align-items:center; justify-content:center; padding:20px;}
.overlay.hidden{display:none;}
.modal{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:24px; width:520px; max-width:100%; max-height:92vh; overflow-y:auto; box-shadow:0 24px 60px rgba(0,0,0,.5);}
.modal h3{margin:0 0 4px; font-size:19px;}
.modal .sub{font-size:13px; color:var(--text-faint); margin-bottom:18px;}
.field{margin-bottom:14px;}
.field label{display:block; font-size:12px; color:var(--text-faint); margin-bottom:5px;}
.field input{width:100%; background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:9px 12px; color:var(--text); font-size:14px; font-family:'Inter',sans-serif;}
.field input:focus{outline:none; border-color:var(--cyan);}
.error-msg{display:none; color:var(--red); font-size:12.5px; margin-bottom:12px;}
.modal-actions{display:flex; justify-content:flex-end; gap:10px; margin-top:18px;}

/* STREAMING_CHUNK:Donant estil al selector de grup... */
.grp-row{display:flex; gap:10px;}
.grp-btn{
  flex:1; background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:10px 12px;
  color:var(--text-dim); font-family:'Space Grotesk',sans-serif; font-size:15px; font-weight:600;
  cursor:pointer; transition:all .12s;
}
.grp-btn:hover{border-color:rgba(0,243,255,.35);}
.grp-btn.selected{border-color:var(--cyan); background:var(--cyan-dim); color:var(--cyan); box-shadow:0 0 12px rgba(0,243,255,.2);}
.grp-hint{font-size:11.5px; color:var(--text-faint); margin-top:6px;}

.quiz-progress{font-size:12px; color:var(--text-faint); margin-bottom:14px; letter-spacing:.4px;}
.q-block{margin-bottom:6px;}
.q-text{font-size:15.5px; font-weight:500; line-height:1.5; margin-bottom:16px;}
.opt{display:flex; align-items:flex-start; gap:11px; background:var(--panel-2); border:1px solid var(--line); border-radius:8px; padding:11px 14px; margin-bottom:8px; cursor:pointer; font-size:13.5px; color:var(--text-dim); transition:all .12s;}
.opt:hover{border-color:rgba(0,243,255,.35);}
.opt.selected{border-color:var(--cyan); background:var(--cyan-dim); color:var(--text);}
.opt .letter{font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--text-faint); background:var(--bg); border-radius:4px; padding:1px 7px; flex-shrink:0;}
.opt.selected .letter{color:var(--cyan);}
.result-card{text-align:center;}
.result-score{font-family:'Space Grotesk',sans-serif; font-size:52px; font-weight:700; color:var(--cyan); text-shadow:0 0 22px rgba(0,243,255,.4); line-height:1.1; margin:6px 0;}
.result-score.fail{color:var(--red); text-shadow:0 0 22px rgba(244,63,94,.35);}

.stat-row{display:flex; gap:10px; margin-bottom:16px;}
.stat-card{flex:1; background:var(--panel-2); border:1px solid var(--line); border-radius:10px; padding:11px 12px; text-align:center;}
.stat-card .eyebrow{margin-bottom:3px;}
.stat-card b{font-family:'Space Grotesk',sans-serif; font-size:19px;}
.badge{font-family:'JetBrains Mono',monospace; font-size:11px; padding:2px 8px; border-radius:20px; display:inline-block;}
.badge.ok{color:var(--green); background:rgba(0,255,136,.12); border:1px solid rgba(0,255,136,.3);}
.badge.ko{color:var(--red); background:rgba(244,63,94,.12); border:1px solid rgba(244,63,94,.3);}
.toolbar{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:12px;}
table.tp{width:100%; border-collapse:collapse; font-size:12.5px;}
table.tp th{position:sticky; top:0; background:var(--panel-2); text-align:left; padding:7px 9px; font-size:10.5px; text-transform:uppercase; letter-spacing:.6px; color:var(--text-faint);}
table.tp td{padding:7px 9px; border-top:1px solid var(--line); color:var(--text-dim);}

::-webkit-scrollbar{width:7px; height:7px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:rgba(0,243,255,.22); border-radius:4px;}
::-webkit-scrollbar-thumb:hover{background:rgba(0,243,255,.5);}

/* STREAMING_CHUNK:Preparant la versió imprimible dels apunts (fons blanc)... */
#printArea{display:none;}

/* STREAMING_CHUNK:Protegint els blocs de codi i les solucions... */
pre{ -webkit-user-select:none; user-select:none; }
body.teacher-mode pre{ -webkit-user-select:text; user-select:text; }
pre .gap{ color:var(--amber); background:rgba(245,158,11,.12); border-radius:3px; }
.code-label{ font-family:'JetBrains Mono',monospace; font-size:10.5px; letter-spacing:.8px; text-transform:uppercase; margin:0 0 5px; color:var(--text-faint); }
.code-label.forats{ color:var(--amber); }
.code-label.sol{ color:var(--green); }
.code-label.sol-teacher{ color:var(--violet); }
.sol-locked{
  display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap;
  background:repeating-linear-gradient(135deg,rgba(181,53,255,.07) 0 12px,rgba(181,53,255,.02) 12px 24px);
  border:1px dashed rgba(181,53,255,.45); border-radius:var(--radius); padding:16px 18px; margin:0 0 14px;
}
.sol-locked .sol-msg{ font-family:'Space Grotesk',sans-serif; font-size:15px; color:var(--text); }
.sol-locked .sol-sub{ font-size:12px; color:var(--text-faint); margin-top:3px; }
.teacher-badge{
  display:flex; align-items:center; gap:8px; background:var(--violet-dim); border:1px solid rgba(181,53,255,.5);
  color:#e3b8ff; border-radius:8px; padding:6px 6px 6px 12px; font-size:12.5px; font-weight:600; flex-shrink:0;
}
.teacher-badge.hidden{ display:none; }
.teacher-badge button{ background:transparent; border:1px solid rgba(181,53,255,.5); color:#e3b8ff; border-radius:6px; padding:4px 9px; font-size:11.5px; cursor:pointer; font-family:'Inter',sans-serif; }
.teacher-badge button:hover{ background:rgba(181,53,255,.25); }
.header-actions{display:flex; gap:8px; flex-shrink:0;}
.teacher-btn.notes:hover{border-color:var(--cyan); color:var(--cyan);}

@media print{
  @page{ size:A4; margin:16mm 14mm; }
  html,body{ background:#fff !important; background-image:none !important; color:#1a1a2e; }
  .topbar,.layout,.overlay{ display:none !important; }
  #printArea{ display:block; font-family:'Inter',sans-serif; font-size:10.5pt; line-height:1.5; color:#1a1a2e; }
  #printArea .pr-cover{ border-bottom:2px solid #0891b2; padding-bottom:8px; margin-bottom:18px; }
  #printArea .pr-cover h1{ font-family:'Space Grotesk',sans-serif; font-size:20pt; margin:0 0 2px; color:#0f172a; }
  #printArea .pr-cover div{ font-size:9.5pt; color:#475569; }
  #printArea .pr-mod{ margin-bottom:16px; }
  #printArea h2{ font-family:'Space Grotesk',sans-serif; font-size:14.5pt; color:#0e7490; margin:18px 0 8px; break-after:avoid; page-break-after:avoid; }
  #printArea h2 .num{ color:#7c3aed; margin-right:6px; }
  #printArea h3{ font-size:11.5pt; color:#0f172a; margin:14px 0 6px; break-after:avoid; page-break-after:avoid; }
  #printArea p,#printArea li{ color:#1f2937; }
  #printArea p{ margin:0 0 8px; }
  #printArea ul,#printArea ol{ margin:0 0 8px; padding-left:20px; }
  #printArea strong{ color:#0f172a; }
  #printArea pre{ background:#f6f7fb; border:1px solid #cbd5e1; color:#0f3d2e; font-size:8.8pt; white-space:pre-wrap; word-break:break-word; break-inside:avoid; page-break-inside:avoid; }
  #printArea pre .cm{ color:#64748b; }
  #printArea pre .bad{ color:#b91c1c; }
  #printArea .mono{ color:#0e7490; background:none !important; padding:0; }
  #printArea .panel-box{ background:#fff; border:1px solid #cbd5e1; color:#1f2937; break-inside:avoid; page-break-inside:avoid; }
  #printArea .panel-box.warn{ border-left:4px solid #dc2626; }
  #printArea .panel-box.tip{ border-left:4px solid #0891b2; }
  #printArea .panel-box.deepen{ border-left:4px solid #7c3aed; }
  #printArea .eyebrow{ color:#64748b; }
  #printArea table.data{ break-inside:avoid; page-break-inside:avoid; }
  #printArea table.data th{ background:#eef2f7; color:#334155; border-bottom:1px solid #94a3b8; }
  #printArea table.data td{ color:#1f2937; border-top:1px solid #cbd5e1; }
  #printArea .pr-challenge{ break-before:page; page-break-before:always; }
  #printArea .pr-task{ display:flex; gap:8px; margin-bottom:5px; color:#1f2937; }
  #printArea .pr-task b{ font-family:'JetBrains Mono',monospace; font-weight:400; color:#0f172a; }
  #printArea pre .gap{ color:#b45309; background:#fef3c7; }
  #printArea .code-label{ color:#64748b; }
  #printArea .sol-locked{ display:block; background:#faf5ff; border:1.5px dashed #7c3aed; color:#4c1d95; padding:10px 12px; break-inside:avoid; page-break-inside:avoid; }
  #printArea .sol-locked .sol-msg{ color:#4c1d95; font-size:10.5pt; }
  #printArea .pr-foot{ margin-top:18px; font-size:8.5pt; color:#94a3b8; border-top:1px solid #e2e8f0; padding-top:6px; }
}

@media (max-width:900px){
  .sidebar{display:none;}
  .content{padding:22px;}
}
</style>
</head>
<body>

<!-- STREAMING_CHUNK:Construint la capçalera amb el cicle, el mòdul i el gauge... -->
<div class="topbar">
  <div class="session-title-row">
    <div class="session-title" id="sessionTitleEl"></div>
    <div class="header-actions">
      <div class="teacher-badge hidden" id="teacherBadge">👨‍🏫 Mode professor <button onclick="exitTeacherMode()">Sortir del mode professor</button></div>
      <button class="teacher-btn notes" onclick="exportNotesPDF()" title="Descarrega les diapositives i el repte en PDF (sense el test)">⬇ Apunts PDF</button>
      <button class="teacher-btn" id="teacherBtn" onclick="openTeacherGate()">🔒 Panell professor</button>
    </div>
  </div>
  <div class="nav-row">
    <button class="nav-btn" id="prevBtn" onclick="goTo(currentIndex-1)">‹</button>
    <div class="nav-mid">
      <div class="nav-label"><b id="navLabel"></b><span id="navModTitle"></span></div>
      <div class="gauge"><div class="gauge-fill" id="gaugeFill"><div class="gauge-ticks" id="gaugeTicks"></div></div></div>
    </div>
    <button class="nav-btn" id="nextBtn" onclick="goTo(currentIndex+1)">›</button>
  </div>
</div>

<div class="layout">
  <div class="sidebar" id="sidebar"></div>
  <div class="content" id="content"></div>
</div>

<!-- STREAMING_CHUNK:Preparant les portes d'accés al test... -->
<div class="overlay hidden" id="quizGate">
  <div class="modal">
    <div id="quizGateBody"></div>
  </div>
</div>

<div class="overlay hidden" id="quizModal">
  <div class="modal" style="width:640px;">
    <div id="quizBody"></div>
  </div>
</div>

<div class="overlay hidden" id="teacherGate">
  <div class="modal">
    <h3>🔒 Accés professor</h3>
    <div class="sub">Introdueix la contrasenya del panell.</div>
    <div class="field"><label>Contrasenya</label><input id="teacherPwdInput" type="password" onkeydown="if(event.key==='Enter')tryUnlockTeacher()"></div>
    <div class="error-msg" id="teacherError">Contrasenya incorrecta.</div>
    <div class="modal-actions">
      <button class="btn" onclick="closeOverlay('teacherGate')">Cancel·la</button>
      <button class="btn primary" id="teacherEnterBtn" onclick="tryUnlockTeacher()">Entrar</button>
    </div>
  </div>
</div>

<!-- STREAMING_CHUNK:Muntant el panell del professor... -->
<div class="overlay hidden" id="teacherPanel">
  <div class="modal" style="width:840px;">
    <h3>📊 Panell del professor</h3>
    <div class="sub" id="tpSession"></div>

    <div class="panel-box" style="display:flex; align-items:center; justify-content:space-between; gap:16px;">
      <div>
        <div class="eyebrow" style="margin-bottom:2px;">Test per als alumnes</div>
        <div style="font-size:13px; color:var(--text-faint);" id="tpOberturaStatus">comprovant estat...</div>
      </div>
      <button class="btn" id="tpOberturaBtn" onclick="toggleObertura()">···</button>
    </div>

    <div class="panel-box" style="display:flex; align-items:center; justify-content:space-between; gap:16px;">
      <div>
        <div class="eyebrow" style="margin-bottom:2px;">Revisió de respostes</div>
        <div style="font-size:13px; color:var(--text-faint);" id="tpRevisioStatus">comprovant estat...</div>

/* ---------- PERSISTÈNCIA DE L'INTENT ---------- */
function saveAttempt(attempt){
  lastAttempt = attempt;
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(attempt)); } catch(e){}
}

function loadAttempt(){
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return null;
    const a = JSON.parse(raw);
    if(!a || !Array.isArray(a.order) || !Array.isArray(a.answers)) return null;
    if(a.order.length !== TEST.questions.length) return null;   // el test ha canviat: intent no vàlid
    return a;
  } catch(e){ return null; }
}

function clearAttempt(){
  lastAttempt = null;
  try { localStorage.removeItem(STORAGE_KEY); } catch(e){}
}

function esc(v){
  return String(v === null || v === undefined ? '' : v)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')

}

/* ---------- GRUPS ---------- */
function toMinutes(hhmm){
  const p = hhmm.split(':');
  return parseInt(p[0],10) * 60 + parseInt(p[1],10);
}

// Retorna el grup que toca segons el dia i l'hora actuals, o null si no n'hi ha cap
function suggestGroup(){
  const now = new Date();
  const mins = now.getHours() * 60 + now.getMinutes();
  for(let i = 0; i < GROUP_SLOTS.length; i++){
    const s = GROUP_SLOTS[i];
    if(now.getDay() === s.day && mins >= toMinutes(s.from) && mins < toMinutes(s.to)) return s.group;
  }
  return null;
}

// Extreu la lletra de grup d'un ID del full ("A24" → "A"); null si l'ID no en porta
function groupOfId(id){
  const m = String(id === null || id === undefined ? '' : id).trim().toUpperCase().match(/^([A-Z])/);
  return (m && GROUPS.indexOf(m[1]) > -1) ? m[1] : null;
}

document.addEventListener('keydown', function(e){
  const tag = (e.target && e.target.tagName) ? e.target.tagName.toLowerCase() : '';
  if(tag === 'input' || tag === 'textarea' || tag === 'select') return;
  const anyOverlay = ['quizGate','quizModal','teacherGate','teacherPanel']
    .some(function(id){ return !document.getElementById(id).classList.contains('hidden'); });
  if(anyOverlay){
    if(e.key === 'Escape'){ ['quizGate','quizModal','teacherGate','teacherPanel'].forEach(closeOverlay); }
    return;
  }
  if(currentView !== 'module') return;
  if(e.key === 'ArrowRight') goTo(currentIndex+1);
  if(e.key === 'ArrowLeft') goTo(currentIndex-1);
});

          + '<p>Per a qui vulgui anar més enllà del contingut mínim. No compten per a la nota.</p>';

      html += '<div class="panel-box deepen"><div class="eyebrow">Repte ' + (i+1) + '</div><p>' + r + '</p></div>';
    });
  }

  html += '<div class="bottom-nav"><button class="btn" onclick="goTo(currentIndex)">‹ Tornar a les diapositives</button>'
        + '<button class="btn primary" onclick="openQuizGate()">Fer el test ›</button></div>';

  buildSidebar();

function toggleTask(i){

function updateChallengeProgress(){

  const bar = document.getElementById('challengeBar');
  if(bar){ bar.style.width = pct + '%'; document.getElementById('challengePct').textContent = pct + '%'; }
}

/* ---------- FLUX DEL TEST ---------- */
function shuffleArray(arr){
  const a = arr.slice();
  for(let i = a.length-1; i > 0; i--){
    const j = Math.floor(Math.random() * (i+1));
    const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

function startQuiz(){
  quizQuestions = shuffleArray(TEST.questions);
  quizAnswers = new Array(quizQuestions.length).fill(null);
  currentQuestionIdx = 0;
  quizSent = false;
  currentView = 'quiz';
  buildSidebar();
  openOverlay('quizModal');
  renderQuizQuestion();
}

function renderQuizQuestion(){
  const q = quizQuestions[currentQuestionIdx];
  const letters = ['A','B','C','D'];
  let optsHtml = q.opts.map(function(o, idx){
    return '<div class="opt' + (quizAnswers[currentQuestionIdx]===idx?' selected':'') + '" onclick="selectAnswer(' + idx + ')">'
         + '<span class="letter">' + letters[idx] + '</span><span>' + esc(o) + '</span></div>';
  }).join('');
  optsHtml += '<div class="opt' + (quizAnswers[currentQuestionIdx]===4?' selected':'') + '" onclick="selectAnswer(4)">'
            + '<span class="letter">E</span><span>NS/NC (no ho sé / no contesto)</span></div>';

  const answered = quizAnswers.filter(function(a){ return a !== null; }).length;

  document.getElementById('quizBody').innerHTML =
    '<div class="quiz-progress">Pregunta ' + (currentQuestionIdx+1) + ' de ' + quizQuestions.length
      + ' &nbsp;·&nbsp; respostes: ' + answered + '/' + quizQuestions.length + '</div>'
    + '<div class="q-block"><div class="q-text">' + esc(q.q) + '</div>' + optsHtml + '</div>'
    + '<div class="modal-actions" id="quizActions">'
    + '<button class="btn small" onclick="askExitQuiz()" style="margin-right:auto;">✕ Sortir</button>'
    + '<button class="btn" onclick="quizPrev()"' + (currentQuestionIdx===0?' disabled':'') + '>‹ Anterior</button>'
    + (currentQuestionIdx === quizQuestions.length-1
        ? '<button class="btn primary" onclick="finishQuiz()">Finalitzar</button>'
        : '<button class="btn primary" onclick="quizNext()">Següent ›</button>')
    + '</div>';
}

function askExitQuiz(){

    '<span style="margin-right:auto; font-size:12.5px; color:var(--red);">Si surts ara perdràs les respostes.</span>'
    + '<button class="btn" onclick="renderQuizQuestion()">Continuar el test</button>'
    + '<button class="btn danger" onclick="exitQuiz()">Sortir igualment</button>';
}

function exitQuiz(){
  closeOverlay('quizModal');
  quizQuestions = []; quizAnswers = []; currentQuestionIdx = 0; studentInfo = null;
  currentView = 'module';
  buildSidebar();
}

function selectAnswer(idx){ quizAnswers[currentQuestionIdx] = idx; renderQuizQuestion(); }
function quizNext(){ if(currentQuestionIdx < quizQuestions.length-1){ currentQuestionIdx++; renderQuizQuestion(); } }
function quizPrev(){ if(currentQuestionIdx > 0){ currentQuestionIdx--; renderQuizQuestion(); } }

function finishQuiz(){
  if(quizSent) return;
  quizSent = true;

  let correct = 0, wrong = 0, blank = 0;
  quizQuestions.forEach(function(q, i){
    const a = quizAnswers[i];
    if(a === null || a === 4) blank++;
    else if(a === q.correct) correct++;
    else wrong++;
  });

  // Encert +1 · Error -0.333 · NS/NC 0 · normalitzat sobre 10
  const raw = (correct * 1) - (wrong * (1/3));
  const grade = Math.round(Math.max(0, raw / quizQuestions.length * 10) * 100) / 100;
  const result = { correct: correct, wrong: wrong, blank: blank, grade: grade, total: quizQuestions.length };

  // Desem l'intent perquè, si torna a entrar, vagi directe al resultat
  saveAttempt({
    student: studentInfo,
    order: quizQuestions.map(function(q){ return TEST.questions.indexOf(q); }),
    answers: quizAnswers.slice(),
    result: result,
    date: new Date().toISOString()
  });

  renderResult(result, false);
  sendResultToSheet({ correct: correct, grade: grade, total: result.total });
}

function renderResult(res, restored){
  document.getElementById('quizBody').innerHTML =
    '<div class="result-card">'
    + '<div class="eyebrow">' + (restored ? 'Test ja realitzat' : 'Resultat') + '</div>'
    + '<div class="result-score' + (res.grade < SESSION.passMark ? ' fail' : '') + '">' + res.grade.toFixed(2) + '</div>'
    + '<p style="color:var(--text-faint); font-size:13px;">sobre 10</p>'
    + '<p>Encerts: <strong>' + res.correct + '</strong> · Errors: <strong>' + res.wrong + '</strong> · NS/NC: <strong>' + res.blank + '</strong> · Total: ' + res.total + '</p>'
    + '<div id="sendStatus" style="font-size:13px; color:var(--text-faint); margin-top:10px;">'
      + (restored ? 'Ja vas enviar aquest resultat. Només pots fer el test una vegada.' : 'Enviant resultat...') + '</div>'

    + '<div id="revisioCheckStatus" style="font-size:13px; color:var(--text-faint); margin-top:8px;"></div>'

}

function sendResultToSheet(res){
  const payload = {
    studentId: studentInfo.id,
    studentName: studentInfo.name,
    topic: TEST.name,
    score: res.correct,
    grade: res.grade,
    totalQuestions: res.total
  };
  // Sense fixar Content-Type: en mode no-cors només s'admet text/plain, i
  // l'Apps Script llegeix igualment el JSON cru a e.postData.contents.
  fetch(SESSION.sheetUrl, { method:'POST', mode:'no-cors', body: JSON.stringify(payload) })
    .then(function(){
      const s = document.getElementById('sendStatus');
      if(s) s.textContent = '✓ Resultat enviat correctament.';
    })
    .catch(function(err){
      console.error('Error enviant a Sheets:', err);
      const s = document.getElementById('sendStatus');
      if(s) s.textContent = "⚠ No s'ha pogut enviar. Avisa el professor.";
    });
}

function renderStudentReview(){
  const letters = ['A','B','C','D'];
  const answerText = function(q, idx){ return idx === 4 ? 'NS/NC' : (letters[idx] + '. ' + esc(q.opts[idx])); };
  let html = '<div style="margin-top:18px; text-align:left;">';
  quizQuestions.forEach(function(q, i){
    const given = quizAnswers[i];
    const isCorrect = given === q.correct;
    html += '<div class="panel-box" style="border-left:3px solid ' + (isCorrect ? 'var(--green)' : 'var(--red)') + ';">'
          + '<div style="font-size:12px; color:var(--text-faint); margin-bottom:4px;">' + (isCorrect ? '✓ Correcta' : '✗ Incorrecta') + '</div>'
          + '<div style="font-weight:500; margin-bottom:6px; font-size:13.5px;">' + esc(q.q) + '</div>'
          + '<div style="font-size:13px; color:var(--text-dim);">La teva resposta: ' + answerText(q, given === null ? 4 : given) + '</div>'
          + (!isCorrect ? '<div style="font-size:13px; color:var(--green);">Resposta correcta: ' + answerText(q, q.correct) + '</div>' : '')
          + '</div>';
  });

function loadTeacherData(feedback){
  const st = document.getElementById('tpStatus');
  st.textContent = 'Consultant el full de càlcul...';
  fetch(SESSION.sheetUrl + '?password=' + encodeURIComponent(teacherPwd || ''))
    .then(function(r){ return r.json(); })
    .then(function(json){
      if(!json || json.status !== 'success' || !Array.isArray(json.data)){
        st.textContent = (json && json.message) ? json.message : 'Resposta inesperada del servidor.';
        return;
      }
      // Ordre de columnes del full: A Data · B ID · C Nom · D Tema · E Encerts · F Nota · G Total
      teacherRows = json.data.map(function(row){
        const v = Object.keys(row).map(function(k){ return row[k]; });
        return { date:v[0], id:v[1], name:v[2], topic:v[3], score:v[4], grade:parseFloat(v[5]) || 0, total:v[6] };
      });
      renderTeacherTable();
      st.textContent = 'Actualitzat: ' + new Date().toLocaleTimeString('ca-ES');
    })
    .catch(function(err){
      console.error(err);
      st.textContent = "No s'ha pogut llegir el full (revisa el desplegament de l'Apps Script).";
    });
}

function groupByStudent(rows){
  const map = {};
  rows.forEach(function(r){
    const id = String(r.id).trim().toUpperCase();
    if(!map[id]) map[id] = { id:id, name:r.name, grades:[] };
    map[id].name = r.name || map[id].name;
    map[id].grades.push(r.grade);
  });
  return Object.keys(map).map(function(id){
    const e = map[id];
    const sum = e.grades.reduce(function(a,b){ return a+b; }, 0);
    return { id:e.id, name:e.name, count:e.grades.length, avg:sum/e.grades.length,
             best:Math.max.apply(null, e.grades), worst:Math.min.apply(null, e.grades) };
  }).sort(function(a,b){ return b.avg - a.avg; });
}

function renderTeacherTable(){
  const wrap = document.getElementById('tpTableWrap');
  const rows = visibleRows();

  if(!rows.length){
    wrap.innerHTML = '<p style="color:var(--text-faint); padding:16px; margin:0;">No hi ha resultats per a aquest filtre.</p>';
    document.getElementById('tpTotal').textContent = '0';
    document.getElementById('tpAvg').textContent = '0.0';
    document.getElementById('tpPass').textContent = '0%';
    return;
  }

  const badge = function(g){ return '<span class="badge ' + (g >= SESSION.passMark ? 'ok' : 'ko') + '">' + g.toFixed(2) + '</span>'; };

  if(viewMode === 'students'){
    const grouped = groupByStudent(rows);
    let html = '<table class="tp"><thead><tr><th>ID</th><th>Alumne</th><th>Tests</th><th>Mitjana</th><th>Millor / Pitjor</th></tr></thead><tbody>';
    grouped.forEach(function(s){
      html += '<tr><td class="mono">' + esc(s.id) + '</td><td>' + esc(s.name) + '</td><td class="mono">' + s.count + '</td>'
            + '<td>' + badge(s.avg) + '</td><td class="mono" style="font-size:11px;">' + s.best.toFixed(2) + ' / ' + s.worst.toFixed(2) + '</td></tr>';
    });
    wrap.innerHTML = html + '</tbody></table>';

    const avg = grouped.reduce(function(a,s){ return a + s.avg; }, 0) / grouped.length;
    const pass = grouped.filter(function(s){ return s.avg >= SESSION.passMark; }).length;
    document.getElementById('tpTotal').textContent = grouped.length;
    document.getElementById('tpAvg').textContent = avg.toFixed(1);
    document.getElementById('tpPass').textContent = Math.round(pass/grouped.length*100) + '%';
    return;
  }

  let html = '<table class="tp"><thead><tr><th>Hora</th><th>ID</th><th>Alumne</th><th>Encerts</th><th>Nota</th></tr></thead><tbody>';
  rows.slice().reverse().forEach(function(r){
    const d = String(r.date);
    const hora = d.indexOf('T') > -1 ? d.substring(11,19) : (d.indexOf(' ') > -1 ? d.split(' ')[1] : d);
    html += '<tr><td class="mono" style="font-size:11px;">' + esc(hora) + '</td><td class="mono">' + esc(r.id) + '</td>'
          + '<td>' + esc(r.name) + '</td><td class="mono">' + esc(r.score) + ' / ' + esc(r.total) + '</td>'
          + '<td>' + badge(r.grade) + '</td></tr>';
  });
  wrap.innerHTML = html + '</tbody></table>';

  const sum = rows.reduce(function(a,r){ return a + r.grade; }, 0);
  const pass = rows.filter(function(r){ return r.grade >= SESSION.passMark; }).length;
  document.getElementById('tpTotal').textContent = rows.length;
  document.getElementById('tpAvg').textContent = (sum/rows.length).toFixed(1);
  document.getElementById('tpPass').textContent = Math.round(pass/rows.length*100) + '%';
}

function exportCSV(){
  const rows = visibleRows();
  if(!rows.length) return;
  let header, lines, suffix;

  if(viewMode === 'students'){
    header = 'ID;Nom;Tests;Mitjana;Millor;Pitjor';
    lines = groupByStudent(rows).map(function(s){
      return [s.id, s.name, s.count, s.avg.toFixed(2), s.best.toFixed(2), s.worst.toFixed(2)].join(';');
    });
    suffix = 'Mitjanes';
  } else {
    header = 'Data;ID;Nom;Tema;Encerts;Nota;Total';
    lines = rows.map(function(r){
      return [r.date, r.id, r.name, r.topic, r.score, r.grade.toFixed(2), r.total].join(';');
    });
    suffix = 'Lliuraments';
  }

  const blob = new Blob(['﻿' + header + '\n' + lines.join('\n')], { type:'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'Unity2D_' + (filterOnlyThis ? 'AquestTest' : 'TotElCurs') + '_'
             + (groupFilter === 'ALL' ? 'TotsGrups' : ('Grup' + groupFilter)) + '_' + suffix + '.csv';
  a.click();
  URL.revokeObjectURL(url);
}

/* ---------- BLOCS DE CODI I SOLUCIONS ----------
   Les solucions (pre.code-sol[data-sol]) no són a l'HTML: es demanen a l'Apps Script
   (action=getSolucions), que només les retorna si l'interruptor SOLUCIONS està activat
   o si s'envia la contrasenya del professor. */
function countSolutionBlocks(){
  return MODULES.reduce(function(n, m){ return n + (m.body.match(/data-sol=/g) || []).length; }, 0);
}

// Ressaltat mínim del codi que arriba del servidor: comentaris // en gris i buits en àmbar
function highlightCode(code){
  return esc(code).split('\n').map(function(line){
    const i = line.indexOf('//');
    return i > -1 ? line.substring(0, i) + '<span class="cm">' + line.substring(i) + '</span>' : line;
  }).join('\n');
}

// Transforma el cos d'una diapositiva segons les marques dels blocs de codi.
// mode: 'screen' (pantalla) o 'print' (apunts PDF)
function renderBody(html, mode){
  if(html.indexOf('code-sol') === -1 && html.indexOf('code-forats') === -1) return html;
  const box = document.createElement('div');
  box.innerHTML = html;

  box.querySelectorAll('pre.code-forats').forEach(function(pre){
    pre.innerHTML = pre.innerHTML.replace(/_{3,}/g, function(g){ return '<span class="gap">' + g + '</span>'; });
    pre.insertAdjacentHTML('beforebegin', '<div class="code-label forats">✏️ Completa els buits</div>');
  });

  box.querySelectorAll('pre.code-sol').forEach(function(pre){
    const id = pre.getAttribute('data-sol');
    const code = solCodes[id];
    if(typeof code === 'string'){
      const label = (teacherMode && !solUnlocked)
        ? '<div class="code-label sol-teacher">👨‍🏫 Solució · només la veus tu (bloquejada per als alumnes)</div>'
        : '<div class="code-label sol">✅ Solució</div>';
      pre.innerHTML = highlightCode(code);
      pre.insertAdjacentHTML('beforebegin', label);
      return;
    }
    let lock;
    if(mode === 'print'){
      lock = '<div class="sol-locked"><div class="sol-msg">🔒 Solució no disponible quan vas descarregar aquests apunts.</div>'
           + '<div class="sol-sub">Torna a descarregar-los quan el professor desbloquegi les solucions.</div></div>';
    } else if(teacherMode){
      lock = '<div class="sol-locked"><div><div class="sol-msg">⚠️ No s’ha trobat aquesta solució al servidor</div>'
           + '<div class="sol-sub">Revisa que el fitxer Sol_ de l’Apps Script tingui la clau «' + esc(id) + '» i el nom del test «' + esc(TEST.name) + '».</div></div></div>';
    } else {
      lock = '<div class="sol-locked"><div><div class="sol-msg">🔒 La solució es desbloqueja al final de la classe</div>'
           + '<div class="sol-sub">' + (solChecked ? 'Primer intenta-ho tu. El professor l’activarà quan toqui.' : 'Comprovant...') + '</div></div>'
           + '<button class="btn small" onclick="loadSolutions(true)">Comprovar de nou</button></div>';
    }
    pre.outerHTML = lock;
  });
  return box.innerHTML;
}

function loadSolutions(feedback){
  if(!HAS_SOLUTIONS) return;
  let url = SESSION.sheetUrl + '?action=getSolucions&test=' + encodeURIComponent(TEST.name);
  if(teacherMode && teacherPwd) url += '&password=' + encodeURIComponent(teacherPwd);
  if(feedback) document.querySelectorAll('.sol-locked .sol-sub').forEach(function(el){ el.textContent = 'Comprovant...'; });
  fetch(url)
    .then(function(r){ return r.json(); })
    .then(function(json){
      solChecked = true;
      if(json && json.status === 'success'){
        solUnlocked = !!json.unlocked;
        solCodes = (json.codes && typeof json.codes === 'object') ? json.codes : {};
      } else if(teacherMode){
        // La contrasenya desada ja no és vàlida (p. ex. s'ha canviat): sortim del mode professor
        exitTeacherMode();
        return;
      }
      refreshCurrentView();
    })
    .catch(function(){
      solChecked = true;
      refreshCurrentView();
      document.querySelectorAll('.sol-locked .sol-sub').forEach(function(el){ el.textContent = "No s'ha pogut comprovar (revisa la connexió)."; });
    });
}

// Torna a pintar la diapositiva activa i els apunts amb l'estat actual de les solucions
function refreshCurrentView(){
  if(currentView === 'module' || currentView === 'quiz'){
    const y = window.scrollY;
    renderModule(currentIndex);
    window.scrollTo(0, y);
  }
  buildPrintArea();
}

// Codi no copiable (fre, no pany): sense selecció, ni copiar, ni retallar, ni menú contextual.
// En mode professor es pot copiar.
['copy','cut','contextmenu','dragstart'].forEach(function(evt){
  document.addEventListener(evt, function(e){
    if(teacherMode) return;
    const t = e.target && e.target.nodeType === 1 ? e.target : (e.target && e.target.parentElement);
    const sel = window.getSelection ? String(window.getSelection()) : '';
    const inCode = t && t.closest && t.closest('pre, .sol-locked');
    const selInCode = sel && Array.prototype.some.call(document.querySelectorAll('#content pre'), function(p){
      const s = window.getSelection();
      return s.rangeCount && s.getRangeAt(0).intersectsNode(p);
    });
    if(inCode || selInCode) e.preventDefault();
  });
});

/* ---------- APUNTS EN PDF (sense el test) ---------- */
// Es construeix una versió de fons blanc amb totes les diapositives i el repte.
// També s'aplica si l'alumne fa Ctrl+P directament.
function buildPrintArea(){
  let html = '<div class="pr-cover"><h1>' + esc(SESSION.name) + '</h1><div>' + esc(SESSION.subtitle) + ' · Apunts de classe</div></div>';
  MODULES.forEach(function(m, i){
    html += '<section class="pr-mod"><h2><span class="num">' + String(i+1).padStart(2,'0') + '</span>' + esc(m.title) + '</h2>' + renderBody(m.body, 'print') + '</section>';
  });
  if(CHALLENGE.tasks.length || CHALLENGE.optional.length){   // sessions sense repte: no s'imprimeix la secció
    html += '<section class="pr-challenge"><h2>Repte pràctic</h2><p>' + CHALLENGE.intro + '</p>';
    CHALLENGE.tasks.forEach(function(t){
      html += '<div class="pr-task"><b>☐</b><span>' + t + '</span></div>';
    });
    if(CHALLENGE.optional.length){
      html += '<h3>Reptes opcionals · no puntuables</h3>';
      CHALLENGE.optional.forEach(function(r, i){
        html += '<div class="panel-box deepen"><div class="eyebrow">Repte ' + (i+1) + '</div><p>' + r + '</p></div>';
      });
    }
    html += '</section>';
  }
  html += '<div class="pr-foot">' + esc(SESSION.subtitle) + '</div>';
  document.getElementById('printArea').innerHTML = html;
}

function exportNotesPDF(){
  buildPrintArea();
  const originalTitle = document.title;
  document.title = 'Apunts - ' + SESSION.subtitle.split('·').pop().trim() + ' - ' + SESSION.name;  // nom suggerit del PDF
  window.print();
  setTimeout(function(){ document.title = originalTitle; }, 1000);
}

}
